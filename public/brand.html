<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cameraman Battle — брендинг</title><style>body{margin:0;padding:32px;background:#0c1018;color:#ecf2ff;font:15px/1.5 "Segoe UI",sans-serif}main{max-width:1200px;margin:auto}h1{font-size:24px}h2{font-size:18px;color:#9bb8e6;margin-top:32px}.brand{display:grid;grid-template-columns:2fr 1fr;gap:20px}.tile{border:1px solid #29384e;background:#151e2c;border-radius:16px;padding:20px;text-align:center}.tile img{width:100%;height:220px;object-fit:contain}.brand .tile:first-child img{height:260px}.assets{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.assets img{height:200px}.misc{display:flex;gap:24px;align-items:center;margin:24px 0}.misc img{height:120px;width:120px;object-fit:contain}.misc img:first-child{border-radius:24px}a{color:#92baff;text-decoration:none}p{color:#97aac5;font-size:12px}@media(max-width:700px){body{padding:16px}.brand{grid-template-columns:1fr}.assets{grid-template-columns:repeat(2,1fr)}.assets img{height:140px}}</style></head><body><main><h1>Cameraman Battle</h1><p>Titan Cameraman · графит, серебро и синий</p><div class="brand"><a class="tile" href="images/brand/logo.png" download><img src="images/brand/logo.webp" alt="Логотип"><p>Логотип · PNG</p></a><a class="tile" href="images/brand/mascot.png" download><img src="images/brand/mascot.webp" alt="Маскот Titan Cameraman"><p>Маскот · PNG</p></a></div><div class="misc"><a href="images/brand/avatar.png" download><img src="images/brand/avatar.webp" alt="Аватар Telegram"></a><a href="images/brand/currency.png" download><img src="images/brand/currency.webp" alt="Игровая монета"></a></div><h2>Иконки кейсов</h2><div class="assets" id="assets"></div><p><a href="/#cases">Открыть проект →</a></p></main><script>const cases=[['patrol','Патруль'],['reinforcement','Подкрепление'],['laboratory','Лаборатория'],['titan','Протокол Titan'],['engineer','Инженерный корпус'],['signed','DevSigned'],['subscribe','За подписку'],['username','За имя'],['referral','По приглашению']];document.querySelector('#assets').innerHTML=cases.map(([id,name])=>`<a class="tile" href="images/cases/case-${id}.png" download><img src="images/cases/case-${id}.webp" alt="${name}"><p>${name}</p></a>`).join('');</script></body></html>
